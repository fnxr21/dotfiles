#set -g default-terminal "tmux-256color"
set -g default-terminal "xterm-256color"
#set -ga terminal-overrides ",*256col*:Tc"
set -ga terminal-overrides ",xterm-256color:Tc"

# better prefix
set -g prefix C-t
unbind C-b
bind C-t send-prefix
set -g focus-events on

# mouse support
#set -g mouse on

# split shortcuts
#bind | split-window -h
#bind - split-window -v

# pane navigation
#bind h select-pane -L
#bind j select-pane -D
#bind k select-pane -U
#bind l select-pane -R

# start window/pane numbers at 1, renumber windows when one closes
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

#craftdogz



 
#split window tobe 2 right-left
unbind %
bind | split-window -h

#split window tobe 2 top-bot
unbind '"'
bind - split-window -v 

#### Key bindings

set-window-option -g mode-keys vi

#bind t send-key C-t
# Reload settings
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"
# Open current directory: "bind o" is in macos.conf / linux.conf
bind -r e kill-pane -a

# vim-like pane switching
bind -r k select-pane -U 
bind -r j select-pane -D 
bind -r h select-pane -L 
bind -r l select-pane -R 

# Moving window
bind-key -n C-S-Left swap-window -t -1 \; previous-window
bind-key -n C-S-Right swap-window -t +1 \; next-window

# Resizing pane
bind -r C-k resize-pane -U 5
bind -r C-j resize-pane -D 5
bind -r C-h resize-pane -L 5
bind -r C-l resize-pane -R 5

#### basic settings

set-option -g status-justify "left"
#set-option utf8-default on
#set-option -g mouse-select-pane
set-window-option -g mode-keys vi
#set-window-option -g utf8 on
# look'n feel
set-option -g status-fg cyan
set-option -g status-bg black
set -g pane-active-border-style fg=colour166,bg=default
set -g window-style fg=colour10,bg=default
set -g window-active-style fg=colour12,bg=default
set-option -g history-limit 64096

set -sg escape-time 10



#######



#### COLOUR (Solarized 256)
source ~/.config/tmux/theme.conf

# allow the title bar to adapt to whatever host you connect to
set -g set-titles on
set -g set-titles-string "#T"
#set -g set-titles-string "#S / #W"

# import
if-shell "uname -s | grep -q Darwin" "source ~/.config/tmux/macos.conf"
if-shell "uname -s | grep -q Linux" "source ~/.config/tmux/linux.conf"

source ~/.config/tmux/statusline.conf
source ~/.config/tmux/utility.conf

#### plugins (tpm: git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-pain-control'
if-shell "test -d ~/.config/tmux/plugins/tpm" "run '~/.config/tmux/plugins/tpm/tpm'"
